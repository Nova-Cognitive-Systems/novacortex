<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NovaCortex">
  <title>NovaCortex</title>
  <defs>
    <radialGradient id="nc-glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0a0e17"/>
  <rect width="512" height="512" rx="104" fill="url(#nc-glow)"/>
  <rect x="4" y="4" width="504" height="504" rx="100" fill="none" stroke="#12303c" stroke-width="8"/>

  <!-- Memory graph drawn as an "N": four nodes joined by typed edges. -->
  <polyline points="158,356 158,156 354,356 354,156"
            fill="none" stroke="#00f0ff" stroke-width="34"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="158" cy="156" r="30" fill="#00f0ff"/>
  <circle cx="158" cy="356" r="30" fill="#00f0ff"/>
  <circle cx="354" cy="356" r="30" fill="#00f0ff"/>
  <circle cx="354" cy="156" r="30" fill="#ff2d95"/>
</svg>
